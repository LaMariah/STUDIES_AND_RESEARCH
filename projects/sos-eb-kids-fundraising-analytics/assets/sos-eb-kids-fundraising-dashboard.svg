<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SOS EB Kids fundraising and donor journey dashboard</title>
  <desc id="desc">Portfolio dashboard showing verified project evidence, an illustrative donor funnel, and a nonprofit measurement framework.</desc>
  <style>
    .bg{fill:#f5f4f7}.panel{fill:#fff}.purple{fill:#5b3f85}.rose{fill:#b84f72}.teal{fill:#348a83}.gold{fill:#bd852a}.gray{fill:#7b7681}.ink{fill:#282433}.muted{fill:#6f6879}.white{fill:#fff}.h1{font:700 27px Arial,sans-serif}.h2{font:700 18px Arial,sans-serif}.kpi{font:700 30px Arial,sans-serif}.label{font:700 13px Arial,sans-serif}.body{font:14px Arial,sans-serif}.small{font:12px Arial,sans-serif}.grid{stroke:#e4e0e8;stroke-width:1}.barlabel{font:700 13px Arial,sans-serif;fill:#282433}
  </style>
  <rect class="bg" width="1200" height="680"/>
  <rect class="purple" x="35" y="28" width="1130" height="72" rx="4"/>
  <text class="h1 white" x="58" y="64">SOS EB Kids Fundraising and Donor Journey</text>
  <text class="body white" x="58" y="86">Portfolio measurement framework | Illustrative funnel | No donor or beneficiary records</text>

  <g transform="translate(35 118)"><rect class="panel" width="260" height="94" rx="4"/><text class="label muted" x="20" y="27">VERIFIED FUNDING OUTCOME</text><text class="kpi teal" x="20" y="65">Secured</text><text class="small muted" x="20" y="82">Amount not disclosed</text></g>
  <g transform="translate(310 118)"><rect class="panel" width="260" height="94" rx="4"/><text class="label muted" x="20" y="27">DONOR JOURNEY</text><text class="kpi purple" x="20" y="65">5 stages</text><text class="small muted" x="20" y="82">Awareness through stewardship</text></g>
  <g transform="translate(585 118)"><rect class="panel" width="260" height="94" rx="4"/><text class="label muted" x="20" y="27">FUNDING PIPELINE</text><text class="kpi gold" x="20" y="65">6 stages</text><text class="small muted" x="20" y="82">Prospect through reporting</text></g>
  <g transform="translate(860 118)"><rect class="panel" width="305" height="94" rx="4"/><text class="label muted" x="20" y="27">DATA PRIVACY</text><text class="kpi rose" x="20" y="65">Protected</text><text class="small muted" x="20" y="82">No personal or medical data</text></g>

  <g transform="translate(35 230)">
    <rect class="panel" width="625" height="410" rx="4"/><text class="h2 ink" x="22" y="32">Illustrative donor funnel</text><text class="small rose" x="405" y="31">NOT ACTUAL PERFORMANCE DATA</text>
    <rect fill="#d7c9e8" x="54" y="66" width="510" height="48"/><text class="label ink" x="75" y="95">Awareness visitors</text><text class="barlabel" x="510" y="95">1,000</text>
    <rect fill="#bba3d6" x="94" y="128" width="430" height="48"/><text class="label ink" x="115" y="157">Engaged visitors</text><text class="barlabel" x="475" y="157">420</text>
    <rect fill="#9470bb" x="134" y="190" width="350" height="48"/><text class="label white" x="155" y="219">Donation page</text><text class="label white" x="430" y="219">150</text>
    <rect class="purple" x="174" y="252" width="270" height="48"/><text class="label white" x="195" y="281">Donation starts</text><text class="label white" x="395" y="281">60</text>
    <rect class="teal" x="214" y="314" width="190" height="48"/><text class="label white" x="235" y="343">Completed</text><text class="label white" x="360" y="343">18</text>
    <text class="small muted" x="54" y="390">Illustrative visitor-to-donor rate: 1.8%</text>
  </g>

  <g transform="translate(680 230)">
    <rect class="panel" width="485" height="198" rx="4"/><text class="h2 ink" x="22" y="32">Verified project evidence</text>
    <circle class="teal" cx="36" cy="67" r="7"/><text class="body ink" x="54" y="72">Mission and donation pathways documented</text>
    <circle class="teal" cx="36" cy="100" r="7"/><text class="body ink" x="54" y="105">BrazilFoundation campaign beneficiary</text>
    <circle class="teal" cx="36" cy="133" r="7"/><text class="body ink" x="54" y="138">Funding outcome reported, amount private</text>
    <circle class="teal" cx="36" cy="166" r="7"/><text class="body ink" x="54" y="171">Proposal, funnel, and web contribution</text>
  </g>

  <g transform="translate(680 442)">
    <rect class="panel" width="485" height="198" rx="4"/><text class="h2 ink" x="22" y="32">Measurement priorities</text>
    <text class="label purple" x="22" y="68">1</text><text class="body ink" x="48" y="68">Track donation journey events</text>
    <text class="label purple" x="22" y="99">2</text><text class="body ink" x="48" y="99">Separate individual and grant pipelines</text>
    <text class="label purple" x="22" y="130">3</text><text class="body ink" x="48" y="130">Measure donor retention and stewardship</text>
    <text class="label purple" x="22" y="161">4</text><text class="body ink" x="48" y="161">Publish only aggregated results</text>
  </g>
</svg>
