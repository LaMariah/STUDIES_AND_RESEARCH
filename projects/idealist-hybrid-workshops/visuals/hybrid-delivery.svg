<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">One learning objective. Two participation routes.</title><desc id="desc">Delivery model / Idealist.org Latino entrepreneur workshops</desc><rect width="1200" height="840" fill="#f5f2ea"/><g font-family="Arial, sans-serif"><text x="48" y="45" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / PROJECT MANAGEMENT</text><text x="48" y="101" font-size="35" fill="#192329" font-weight="700">One learning objective. Two participation routes.</text><rect x="48" y="150" width="1104" height="110" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="70" y="185" font-size="23" fill="white" font-weight="700">AUDIENCE + PROGRAMME</text><text x="70" y="218" font-size="18" fill="white" font-weight="400">Surveys and Facebook discussions inform the workshop focus.</text><rect x="48" y="300" width="1104" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="335" font-size="23" fill="#192329" font-weight="700">PARTNER COORDINATION</text><text x="70" y="368" font-size="18" fill="#192329" font-weight="400">Align the workshop content with the Brazilian Embassy partnership.</text><path d="M600 260v40 M600 410v24 H312v26 M600 434h288v26" fill="none" stroke="#244ADB" stroke-width="3"/><rect x="48" y="460" width="528" height="140" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="495" font-size="23" fill="#192329" font-weight="700">IN-PERSON WORKSHOP</text><text x="70" y="528" font-size="18" fill="#192329" font-weight="400">Physical participation</text><text x="70" y="555" font-size="18" fill="#192329" font-weight="400">Workshop discussion and connections</text><rect x="624" y="460" width="528" height="140" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="646" y="495" font-size="23" fill="white" font-weight="700">ZOOM PARTICIPATION</text><text x="646" y="528" font-size="18" fill="white" font-weight="400">Online delivery</text><text x="646" y="555" font-size="18" fill="white" font-weight="400">Breakout-room discussions</text><path d="M312 600v36H600v24 M888 600v36H600" fill="none" stroke="#244ADB" stroke-width="3"/><rect x="48" y="660" width="1104" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="695" font-size="23" fill="#192329" font-weight="700">FEEDBACK + LEARNING</text><text x="70" y="728" font-size="18" fill="#192329" font-weight="400">Post-event surveys ask about useful business connections.</text><text x="48" y="812" font-size="16" fill="#53616A" font-weight="400">Delivery model / Idealist.org Latino entrepreneur workshops</text></g></svg>