<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Keep the participant experience connected.</title><desc id="desc">Participant journey / Workshop planning and follow-through</desc><rect width="1200" height="840" fill="#f5f2ea"/><g font-family="Arial, sans-serif"><text x="48" y="45" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / PROJECT MANAGEMENT</text><text x="48" y="101" font-size="35" fill="#192329" font-weight="700">Keep the participant experience connected.</text><rect x="48" y="150" width="1104" height="110" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="70" y="185" font-size="23" fill="white" font-weight="700">01 / RELEVANT TOPIC</text><text x="70" y="218" font-size="18" fill="white" font-weight="400">A practical learning focus shaped by audience questions.</text><path d="M600 260v35H312v25 M600 295h288v25" fill="none" stroke="#244ADB" stroke-width="3"/><rect x="48" y="320" width="528" height="130" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="355" font-size="23" fill="#192329" font-weight="700">02 / JOIN IN PERSON</text><text x="70" y="388" font-size="18" fill="#192329" font-weight="400">Participate in the workshop room.</text><rect x="624" y="320" width="528" height="130" rx="12" fill="white" stroke="#d1d8da"/><text x="646" y="355" font-size="23" fill="#192329" font-weight="700">02 / JOIN ONLINE</text><text x="646" y="388" font-size="18" fill="#192329" font-weight="400">Participate through Zoom.</text><path d="M312 450v35H600v25 M888 450v35H600" fill="none" stroke="#244ADB" stroke-width="3"/><rect x="48" y="510" width="1104" height="110" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="70" y="545" font-size="23" fill="white" font-weight="700">03 / DISCUSS + CONNECT</text><text x="70" y="578" font-size="18" fill="white" font-weight="400">Use the learning session and discussions to connect with others.</text><path d="M600 620v40" stroke="#244ADB" stroke-width="3"/><rect x="48" y="660" width="1104" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="695" font-size="23" fill="#192329" font-weight="700">04 / SHARE FEEDBACK</text><text x="70" y="728" font-size="18" fill="#192329" font-weight="400">Respond to the post-event survey about the experience and connections.</text><text x="48" y="812" font-size="16" fill="#53616A" font-weight="400">Participant journey / Workshop planning and follow-through</text></g></svg>