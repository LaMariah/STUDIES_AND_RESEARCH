<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title"><title id="title">Coordinate one programme across venues</title><rect width="1200" height="790" fill="white"/><rect width="10" height="790" fill="#ef3851"/><g font-family="Arial,sans-serif"><text x="48" y="49" font-size="22" fill="#ba2540" font-weight="700">SÃO PAULO WINE WEEK</text><text x="48" y="104" font-size="42" fill="#193247" font-weight="700">Coordinate one programme across venues</text><text x="48" y="140" font-size="17" fill="#516778" font-weight="700">WORKFLOW RECONSTRUCTION  /  PUBLIC PROGRAMME + PRODUCTION LENS</text><rect x="48" y="174" width="1104" height="50" rx="5" fill="#172b3b"/><text x="65" y="206" font-size="20" fill="white" font-weight="700">PRODUCTION SEQUENCE</text><text x="655" y="206" font-size="20" fill="white" font-weight="700">WHO HANDS OFF</text><text x="920" y="206" font-size="20" fill="white" font-weight="700">OUTPUT</text><path d="M84 269v344" stroke="#9ab1bd" stroke-width="3"/><rect x="110" y="239" width="1042" height="90" rx="7" fill="#f4f7fa"/><circle cx="84" cy="274" r="19" fill="#166b62"/><text x="78" y="281" font-size="19" fill="white" font-weight="700">1</text><text x="130" y="273" font-size="24" fill="#193247" font-weight="700">Publish the programme</text><text x="130" y="303" font-size="18" fill="#193247" >Confirm the participating venues and service windows.</text><text x="655" y="283" font-size="17" fill="#193247" >Organiser to venue leads</text><text x="920" y="283" font-size="17" fill="#166b62" font-weight="700">Shared programme</text><rect x="110" y="344" width="1042" height="90" rx="7" fill="#eef5f6"/><circle cx="84" cy="379" r="19" fill="#166b62"/><text x="78" y="386" font-size="19" fill="white" font-weight="700">2</text><text x="130" y="378" font-size="24" fill="#193247" font-weight="700">Prepare each venue</text><text x="130" y="408" font-size="18" fill="#193247" >Align the tasting format with each restaurant’s service.</text><text x="655" y="388" font-size="17" fill="#193247" >Venue leads to floor teams</text><text x="920" y="388" font-size="17" fill="#166b62" font-weight="700">Venue briefing sheet</text><rect x="110" y="449" width="1042" height="90" rx="7" fill="#f4f7fa"/><circle cx="84" cy="484" r="19" fill="#166b62"/><text x="78" y="491" font-size="19" fill="white" font-weight="700">3</text><text x="130" y="483" font-size="24" fill="#193247" font-weight="700">Run live service</text><text x="130" y="513" font-size="18" fill="#193247" >Check readiness before service and resolve local changes.</text><text x="655" y="493" font-size="17" fill="#193247" >Floor teams to organiser</text><text x="920" y="493" font-size="17" fill="#166b62" font-weight="700">Daily status and issue log</text><rect x="110" y="554" width="1042" height="90" rx="7" fill="#eef5f6"/><circle cx="84" cy="589" r="19" fill="#166b62"/><text x="78" y="596" font-size="19" fill="white" font-weight="700">4</text><text x="130" y="588" font-size="24" fill="#193247" font-weight="700">Transition to the fair</text><text x="130" y="618" font-size="18" fill="#193247" >Brief the next team on what carries over and who owns it.</text><text x="655" y="598" font-size="17" fill="#193247" >Restaurant teams to fair team</text><text x="920" y="598" font-size="17" fill="#166b62" font-weight="700">Closeout and handoff note</text><path d="M48 674h1104" stroke="#ef3851" stroke-width="2"/><text x="48" y="715" font-size="21" fill="#193247" font-weight="700">Programme coordination · Restaurant service and fair handoff</text><text x="48" y="752" font-size="18" fill="#516778" >Multi-venue delivery model · Based on the published programme</text></g></svg>