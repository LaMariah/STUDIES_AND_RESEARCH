<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title"><title id="title">One programme. Multiple venues.</title><rect width="1200" height="760" fill="#fff"/><rect width="12" height="760" fill="#ed3650"/><g font-family="Arial,sans-serif"><text x="52" y="55" font-size="20" fill="#be233c" font-weight="700">GERUSA SOUZA  |  SÃO PAULO WINE WEEK</text><text x="52" y="112" font-size="43" fill="#18334a" font-weight="700">One programme. Multiple venues.</text><rect x="52" y="152" width="1096" height="59" fill="#182936"/><text x="72" y="190" font-size="23" fill="#fff" font-weight="700">PUBLIC PROGRAMME | 2017 REFERENCE</text><text x="56" y="257" font-size="24" fill="#235c83" font-weight="700">01  Restaurant activations</text><text x="606" y="257" font-size="24" fill="#235c83" font-weight="700">02  Three-wine flights</text><text x="56" y="306" font-size="24" fill="#235c83" font-weight="700">03  Weekend lunch and dinner</text><text x="606" y="306" font-size="24" fill="#235c83" font-weight="700">04  Fair in organiser overview</text><path d="M52 330h1096" stroke="#ed3650" stroke-width="3"/><text x="52" y="373" font-size="22" fill="#be233c" font-weight="700">MY WORK | SELECTED EVENT EXPERIENCE</text><text x="52" y="419" font-size="25" fill="#18334a">São Paulo Wine Week is part of my selected event work.</text><text x="52" y="455" font-size="25" fill="#18334a">My individual assignment and deliverables are not documented here.</text><text x="52" y="525" font-size="22" fill="#be233c" font-weight="700">ILLUSTRATIVE DELIVERABLES FOR THIS FORMAT</text><rect x="52" y="553" width="352" height="119" rx="8" fill="#eef4f8"/><text x="68" y="597" font-size="25" fill="#18334a" font-weight="700">Venue brief</text><text x="68" y="633" font-size="19" fill="#18334a">Service windows and venue contacts</text><rect x="421" y="553" width="352" height="119" rx="8" fill="#eef4f8"/><text x="437" y="597" font-size="25" fill="#18334a" font-weight="700">Guest programme</text><text x="437" y="633" font-size="19" fill="#18334a">Where to go and what to expect</text><rect x="790" y="553" width="352" height="119" rx="8" fill="#eef4f8"/><text x="806" y="597" font-size="25" fill="#18334a" font-weight="700">Readiness tracker</text><text x="806" y="633" font-size="19" fill="#18334a">Owners, deadlines and venue sign-off</text><text x="52" y="720" font-size="19" fill="#47647a">Programme and role are shown separately from reusable planning examples.</text></g></svg>