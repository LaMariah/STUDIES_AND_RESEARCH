<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title"><title id="title">One programme, multiple venues</title><rect width="1200" height="800" fill="#edf3f5"/><g font-family="Arial,sans-serif" fill="#112e43"><rect x="36" y="30" width="1128" height="110" rx="14" fill="#112e43"/><text x="65" y="72" fill="#a6e4d1" font-size="23" font-weight="bold">SÃO PAULO WINE WEEK / PROGRAMME WALKTHROUGH</text><text x="65" y="115" fill="white" font-size="39" font-weight="bold">One programme, multiple venues</text><rect x="36" y="170" width="555" height="246" rx="14" fill="#d8efea"/><text x="64" y="230" font-size="28" font-weight="bold">01</text><text x="64" y="286" font-size="32" font-weight="bold">Restaurant activations</text><text x="64" y="330" font-size="23">Participating venues host guests</text><text x="64" y="364" font-size="23">during their own service windows.</text><rect x="609" y="170" width="555" height="246" rx="14" fill="#dce9f7"/><text x="637" y="230" font-size="28" font-weight="bold">02</text><text x="637" y="286" font-size="32" font-weight="bold">Wine flights</text><text x="637" y="330" font-size="23">Three-wine tastings are built</text><text x="637" y="364" font-size="23">into the restaurant experience.</text><rect x="36" y="440" width="555" height="246" rx="14" fill="#ffedcc"/><text x="64" y="500" font-size="28" font-weight="bold">03</text><text x="64" y="556" font-size="32" font-weight="bold">Weekend service</text><text x="64" y="600" font-size="23">The 2017 public programme</text><text x="64" y="634" font-size="23">included lunch and dinner.</text><rect x="609" y="440" width="555" height="246" rx="14" fill="#e9e0f5"/><text x="637" y="500" font-size="28" font-weight="bold">04</text><text x="637" y="556" font-size="32" font-weight="bold">Closing fair</text><text x="637" y="600" font-size="23">The organiser describes a fair</text><text x="637" y="634" font-size="23">alongside restaurant activations.</text><text x="36" y="752" font-size="21">Public programme overview · Not a venue map or a record of personal responsibilities</text></g></svg>