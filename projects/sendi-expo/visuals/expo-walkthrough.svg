<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title"><title id="title">Build an exhibition around its exhibitors</title><rect width="1200" height="800" fill="#edf3f5"/><g font-family="Arial,sans-serif" fill="#112e43"><rect x="36" y="30" width="1128" height="110" rx="14" fill="#112e43"/><text x="65" y="72" fill="#a6e4d1" font-size="23" font-weight="bold">SENDI EXPO / EXHIBITION PRODUCTION</text><text x="65" y="115" fill="white" font-size="39" font-weight="bold">Build an exhibition around its exhibitors</text><rect x="36" y="170" width="555" height="246" rx="14" fill="#d8efea"/><text x="64" y="230" font-size="28" font-weight="bold">01</text><text x="64" y="286" font-size="32" font-weight="bold">Event context</text><text x="64" y="330" font-size="23">Brazil’s national seminar on</text><text x="64" y="364" font-size="23">electricity distribution.</text><rect x="609" y="170" width="555" height="246" rx="14" fill="#dce9f7"/><text x="637" y="230" font-size="28" font-weight="bold">02</text><text x="637" y="286" font-size="32" font-weight="bold">Exhibitor mix</text><text x="637" y="330" font-size="23">Utilities and technology suppliers</text><text x="637" y="364" font-size="23">shared the exhibition setting.</text><rect x="36" y="440" width="555" height="246" rx="14" fill="#ffedcc"/><text x="64" y="500" font-size="28" font-weight="bold">03</text><text x="64" y="556" font-size="32" font-weight="bold">My role</text><text x="64" y="600" font-size="23">Production direction in partnership</text><text x="64" y="634" font-size="23">with Cybilla Spinelli / Expo3.</text><rect x="609" y="440" width="555" height="246" rx="14" fill="#e9e0f5"/><text x="637" y="500" font-size="28" font-weight="bold">04</text><text x="637" y="556" font-size="32" font-weight="bold">Planning lens</text><text x="637" y="600" font-size="23">Align exhibitor briefs, suppliers,</text><text x="637" y="634" font-size="23">installation and venue handoffs.</text><text x="3