Venue access and supplier handoffs</text><rect x="790" y="553" width="352" height="119" rx="8" fill="#eef4f8"/><text x="806" y="597" font-size="25" fill="#18334a" font-weight="700">Opening checklist</text><text x="806" y="633" font-size="19" fill="#18334a">Readiness, approvals and escalation</text><text x="52" y="720" font-size="19" fill="#47647a">Programme and role are shown separately from reusable planning examples.</text></g></svg>