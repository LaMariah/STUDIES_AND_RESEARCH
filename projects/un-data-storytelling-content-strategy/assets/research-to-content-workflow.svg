<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Research-to-content workflow</title>
  <desc id="desc">A five-step workflow moving from credible sources through analysis and Tableau dashboards to accessible content and engagement review.</desc>
  <style>.bg{fill:#f4f7f8}.card{fill:#fff;stroke:#d9e2e7;stroke-width:2}.navy{fill:#173a5e}.blue{fill:#3d73a8}.teal{fill:#26856b}.gold{fill:#c38b2c}.rose{fill:#b84f68}.ink{fill:#1f2b36}.muted{fill:#667583}.white{fill:#fff}.title{font:700 28px Arial,sans-serif}.heading{font:700 17px Arial,sans-serif}.body{font:14px Arial,sans-serif}.small{font:12px Arial,sans-serif}.arrow{stroke:#8b98a4;stroke-width:3;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#8b98a4"/></marker></defs>
  <rect class="bg" width="1200" height="520"/>
  <rect class="navy" x="35" y="28" width="1130" height="76" rx="5"/>
  <text class="title white" x="58" y="65">Research-to-Content Workflow</text><text class="body white" x="58" y="88">Turning public evidence into clear communication and measurable learning</text>
  <g transform="translate(45 150)"><rect class="card" width="190" height="180" rx="8"/><circle class="blue" cx="35" cy="36" r="19"/><text class="heading white" x="30" y="42">1</text><text class="heading ink" x="62" y="42">Research</text><text class="body muted" x="20" y="82">UN and UNESCO data</text><text class="body muted" x="20" y="108">Credible public sources</text><text class="body muted" x="20" y="134">Topic and audience needs</text></g>
  <path class="arrow" d="M245 240 H280"/>
  <g transform="translate(290 150)"><rect class="card" width="190" height="180" rx="8"/><circle class="teal" cx="35" cy="36" r="19"/><text class="heading white" x="30" y="42">2</text><text class="heading ink" x="62" y="42">Analyze</text><text class="body muted" x="20" y="82">Clean and compare</text><text class="body muted" x="20" y="108">Find trends and gaps</text><text class="body muted" x="20" y="134">Check definitions</text></g>
  <path class="arrow" d="M490 240 H525"/>
  <g transform="translate(535 150)"><rect class="card" width="190" height="180" rx="8"/><circle class="gold" cx="35" cy="36" r="19"/><text class="heading white" x="30" y="42">3</text><text class="heading ink" x="62" y="42">Visualize</text><text class="body muted" x="20" y="82">Tableau dashboards</text><text class="body muted" x="20" y="108">Maps and trends</text><text class="body muted" x="20" y="134">Audience-ready charts</text></g>
  <path class="arrow" d="M735 240 H770"/>
  <g transform="translate(780 150)"><rect class="card" width="190" height="180" rx="8"/><circle class="rose" cx="35" cy="36" r="19"/><text class="heading white" x="30" y="42">4</text><text class="heading ink" x="62" y="42">Tell</text><text class="body muted" x="20" y="82">Plain-language insight</text><text class="body muted" x="20" y="108">Infographics and posts</text><text class="body muted" x="20" y="134">Content calendar</text></g>
  <path class="arrow" d="M980 240 H1015"/>
  <g transform="translate(1025 150)"><rect class="card" width="130" height="180" rx="8"/><circle class="navy" cx="32" cy="36" r="19"/><text class="heading white" x="27" y="42">5</text><text class="heading ink" x="58" y="42">Learn</text><text class="body muted" x="16" y="82">Reach</text><text class="body muted" x="16" y="108">Saves and shares</text><text class="body muted" x="16" y="134">Comments</text></g>
  <rect class="card" x="245" y="378" width="710" height="86" rx="8"/><text class="heading ink" x="270" y="410">Control point</text><text class="body muted" x="270" y="438">Check data accuracy, cultural sensitivity, source rights, and audience relevance before publishing.</text>
</svg>
