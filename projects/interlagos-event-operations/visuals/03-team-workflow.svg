<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Keep owners and handoffs visible.</title><desc id="desc">Four stakeholder lanes across planning, readiness and delivery/closeout. Proposed workflow for review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53616A"/></marker></defs><rect width="1200" height="920" fill="#F5F2EA"/><g font-family="Arial, sans-serif"><text x="48" y="48" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / INTERLAGOS / WORKING CASE STUDY</text><text x="48" y="100" font-size="36" fill="#192329" font-weight="700">Keep owners and handoffs visible.</text><text x="56" y="155" font-size="14" fill="#244ADB" font-weight="700">CLIENT / APPROVER</text><text x="338" y="155" font-size="14" fill="#244ADB" font-weight="700">GERUSA / COORDINATION</text><text x="620" y="155" font-size="14" fill="#244ADB" font-weight="700">TEAM LEADS</text><text x="902" y="155" font-size="14" fill="#244ADB" font-weight="700">SUPPLIERS</text><rect x="48" y="195" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="70" y="230" font-size="22" fill="#192329" font-weight="700">Agree scope</text><path d="M177 311 L177 369" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="330" y="195" width="258" height="116" rx="12" fill="#244ADB" stroke="#244ADB"/><text x="352" y="230" font-size="22" fill="#FFFFFF" font-weight="700">Translate into delivery</text><text x="352" y="260" font-size="18" fill="#FFFFFF" font-weight="400">plan</text><path d="M459 311 L459 369" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="612" y="195" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="634" y="230" font-size="22" fill="#192329" font-weight="700">Review crew needs</text><path d="M741 311 L741 369" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="894" y="195" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="916" y="230" font-size="22" fill="#192329" font-weight="700">Confirm scope + lead</text><text x="916" y="260" font-size="18" fill="#192329" font-weight="400">times</text><path d="M1023 311 L1023 369" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M306 251 L330 251" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M588 251 L612 251" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M870 251 L894 251" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="375" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="70" y="410" font-size="22" fill="#192329" font-weight="700">Review changes</text><path d="M177 491 L177 549" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="330" y="375" width="258" height="116" rx="12" fill="#244ADB" stroke="#244ADB"/><text x="352" y="410" font-size="22" fill="#FFFFFF" font-weight="700">Resolve shared</text><text x="352" y="440" font-size="18" fill="#FFFFFF" font-weight="400">dependencies</text><path d="M459 491 L459 549" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="612" y="375" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="634" y="410" font-size="22" fill="#192329" font-weight="700">Brief teams + check</text><text x="634" y="440" font-size="18" fill="#192329" font-weight="400">readiness</text><path d="M741 491 L741 549" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="894" y="375" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="916" y="410" font-size="22" fill="#192329" font-weight="700">Confirm installation</text><text x="916" y="440" font-size="18" fill="#192329" font-weight="400">readiness</text><path d="M1023 491 L1023 549" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M306 431 L330 431" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M588 431 L612 431" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M870 431 L894 431" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="555" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="70" y="590" font-size="22" fill="#192329" font-weight="700">Receive closeout</text><rect x="330" y="555" width="258" height="116" rx="12" fill="#244ADB" stroke="#244ADB"/><text x="352" y="590" font-size="22" fill="#FFFFFF" font-weight="700">Coordinate issues +</text><text x="352" y="620" font-size="18" fill="#FFFFFF" font-weight="400">follow-up</text><rect x="612" y="555" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="634" y="590" font-size="22" fill="#192329" font-weight="700">Report floor issues</text><rect x="894" y="555" width="258" height="116" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="916" y="590" font-size="22" fill="#192329" font-weight="700">Complete handback</text><path d="M306 611 L330 611" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M588 611 L612 611" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M870 611 L894 611" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="48" y="800" font-size="21" fill="#192329" font-weight="700">Handoff rule: record the owner, required input, acceptance check, and escalation route.</text><text x="48" y="838" font-size="18" fill="#53616A" font-weight="400">Arrows show a suggested coordination sequence, not a confirmed historical reporting hierarchy.</text><text x="48" y="890" font-size="16" fill="#53616A" font-weight="400">Retrospective reconstruction. Workflow and boundaries require review.</text></g></svg>