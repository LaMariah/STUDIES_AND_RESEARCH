<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" role="img" aria-labelledby="title desc"><title id="title">One weekend. Clear delivery boundaries.</title><desc id="desc">Scope map connecting VIP hospitality work, Porsche Cup support and shared operational interfaces.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53616A"/></marker></defs><rect width="1200" height="686" fill="#F5F2EA"/><g font-family="Arial, sans-serif"><text x="48" y="48" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / INTERLAGOS / EVENT OPERATIONS</text><text x="48" y="100" font-size="36" fill="#192329" font-weight="700">One weekend. Clear delivery boundaries.</text><rect x="48" y="135" width="1104" height="112" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="70" y="170" font-size="22" fill="#192329" font-weight="700">RACE WEEKEND CONTEXT</text><text x="70" y="200" font-size="18" fill="#192329" font-weight="400">F1 and Porsche Cup share a venue and operating constraints.</text><text x="70" y="226" font-size="18" fill="#192329" font-weight="400">Hospitality, staffing and supplier activity connect through the race-weekend schedule.</text><path d="M600 247 L600 282" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="292" width="536" height="156" rx="12" fill="#244ADB" stroke="#244ADB"/><text x="70" y="327" font-size="22" fill="#FFFFFF" font-weight="700">MY DELIVERY SCOPE</text><text x="70" y="357" font-size="18" fill="#FFFFFF" font-weight="400">VIP hospitality environments</text><text x="70" y="383" font-size="18" fill="#FFFFFF" font-weight="400">Staffing, supplier and cost coordination</text><text x="70" y="409" font-size="18" fill="#FFFFFF" font-weight="400">Client communication</text><rect x="616" y="292" width="536" height="156" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="638" y="327" font-size="22" fill="#192329" font-weight="700">PORSCHE CUP SUPPORT</text><text x="638" y="357" font-size="18" fill="#192329" font-weight="400">Hospitality and event support</text><text x="638" y="383" font-size="18" fill="#192329" font-weight="400">Coordination alongside the F1 assignment</text><text x="638" y="409" font-size="18" fill="#192329" font-weight="400">Client, supplier and team communication</text><path d="M316 448 L316 487" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M884 448 L884 487" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="497" width="1104" height="114" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="70" y="532" font-size="22" fill="#192329" font-weight="700">SHARED OPERATIONAL INTERFACES</text><text x="70" y="562" font-size="18" fill="#192329" font-weight="400">Venue access • installation • credentials • guest movement • supplier handoffs</text><text x="70" y="588" font-size="18" fill="#192329" font-weight="400">Connect approvals, delivery owners and handoffs across the assigned areas.</text><text x="48" y="656" font-size="16" fill="#53616A" font-weight="400">Gerusa Souza / Event planning, hospitality and operations</text></g></svg>