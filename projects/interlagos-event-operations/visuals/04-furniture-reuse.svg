<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">One furniture resource. Two major accounts.</title><desc id="desc">Gerusa coordinated reuse of some Formula 1 furniture for Porsche Cup, saving money and venue time under tight budgets and production constraints. Conceptual resource map, not a movement schedule.</desc><rect width="1200" height="760" fill="#F5F2EA"/><g font-family="Arial, sans-serif"><text x="48" y="48" font-size="15" fill="#244ADB">GERUSA SOUZA / INTERLAGOS / RESOURCE COORDINATION</text><text x="48" y="105" font-size="38" fill="#192329">One furniture resource. Two major accounts.</text><rect x="48" y="142" width="1104" height="100" rx="12" fill="white" stroke="#D4D9DC"/><text x="72" y="180" font-size="17" fill="#244ADB">THE CONSTRAINT</text><text x="72" y="215" font-size="24" fill="#192329">Tight budgets. Limited production time. Two accounts to support.</text><rect x="48" y="290" width="510" height="150" rx="12" fill="white" stroke="#D4D9DC"/><text x="72" y="330" font-size="22" fill="#244ADB">FORMULA 1</text><text x="72" y="370" font-size="23" fill="#192329">Furniture within the F1 assignment</text><text x="72" y="407" font-size="19" fill="#53616A">Some items reused for Porsche Cup</text><rect x="642" y="290" width="510" height="150" rx="12" fill="white" stroke="#D4D9DC"/><text x="666" y="330" font-size="22" fill="#244ADB">PORSCHE CUP</text><text x="666" y="370" font-size="23" fill="#192329">Furniture supporting the account</text><text x="666" y="407" font-size="19" fill="#53616A">Reuse coordinated at the venue</text><path d="M558 365 L628 365" stroke="#244ADB" stroke-width="3"/><path d="M618 357 L630 365 L618 373" fill="none" stroke="#244ADB" stroke-width="3"/><rect x="48" y="488" width="1104" height="150" rx="12" fill="#244ADB"/><text x="72" y="528" font-size="17" fill="white">MY DECISION</text><text x="72" y="567" font-size="27" fill="white">Connect furniture allocation across both assignments.</text><text x="72" y="608" font-size="23" fill="white">Save money and venue time while supporting both accounts.</text><text x="48" y="695" font-size="17" fill="#244ADB">RESOURCE PLANNING  /  COST MANAGEMENT  /  VENUE OPERATIONS</text><text x="48" y="730" font-size="16" fill="#53616A">Conceptual resource map. The arrow shows reuse, not a dated transfer sequence.</text></g></svg>