<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc"><title id="title">From brief to client follow-up.</title><desc id="desc">Delivery phases, outputs and review points from briefing through follow-up.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53616A"/></marker></defs><rect width="1200" height="990" fill="#F5F2EA"/><g font-family="Arial, sans-serif"><text x="48" y="48" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / INTERLAGOS / EVENT OPERATIONS</text><text x="48" y="100" font-size="36" fill="#192329" font-weight="700">From brief to client follow-up.</text><text x="50" y="177" font-size="17" fill="#244ADB" font-weight="700">01 / BRIEF</text><rect x="220" y="145" width="660" height="126" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="242" y="180" font-size="22" fill="#192329" font-weight="700">Agree the assignment</text><text x="242" y="210" font-size="18" fill="#192329" font-weight="400">Audience, scope, budget assumptions</text><text x="242" y="236" font-size="18" fill="#192329" font-weight="400">Output: brief + responsibilities</text><text x="910" y="182" font-size="13" fill="#53616A" font-weight="700">REVIEW POINT</text><text x="910" y="213" font-size="17" fill="#192329" font-weight="700">Scope accepted</text><path d="M550 271 L550 297" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="333" font-size="17" fill="#244ADB" font-weight="700">02 / PLAN</text><rect x="220" y="301" width="660" height="126" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="242" y="336" font-size="22" fill="#192329" font-weight="700">Coordinate resources</text><text x="242" y="366" font-size="18" fill="#192329" font-weight="400">Suppliers, staffing and dependencies</text><text x="242" y="392" font-size="18" fill="#192329" font-weight="400">Output: schedule + resource trackers</text><text x="910" y="338" font-size="13" fill="#53616A" font-weight="700">REVIEW POINT</text><text x="910" y="369" font-size="17" fill="#192329" font-weight="700">Resources aligned</text><path d="M550 427 L550 453" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="489" font-size="17" fill="#244ADB" font-weight="700">03 / PREPARE</text><rect x="220" y="457" width="660" height="126" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="242" y="492" font-size="22" fill="#192329" font-weight="700">Check delivery readiness</text><text x="242" y="522" font-size="18" fill="#192329" font-weight="400">Installation, access and team briefings</text><text x="242" y="548" font-size="18" fill="#192329" font-weight="400">Output: readiness checklist</text><text x="910" y="494" font-size="13" fill="#53616A" font-weight="700">REVIEW POINT</text><text x="910" y="525" font-size="17" fill="#192329" font-weight="700">Opening decision</text><path d="M550 583 L550 609" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="645" font-size="17" fill="#244ADB" font-weight="700">04 / DELIVER</text><rect x="220" y="613" width="660" height="126" rx="12" fill="#244ADB" stroke="#244ADB"/><text x="242" y="648" font-size="22" fill="#FFFFFF" font-weight="700">Coordinate live operations</text><text x="242" y="678" font-size="18" fill="#FFFFFF" font-weight="400">Guest service, handoffs and issues</text><text x="242" y="704" font-size="18" fill="#FFFFFF" font-weight="400">Output: run-of-show + issue log</text><text x="910" y="650" font-size="13" fill="#53616A" font-weight="700">REVIEW POINT</text><text x="910" y="681" font-size="17" fill="#192329" font-weight="700">Area handback</text><path d="M550 739 L550 765" stroke="#53616A" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="801" font-size="17" fill="#244ADB" font-weight="700">05 / CLOSE</text><rect x="220" y="769" width="660" height="126" rx="12" fill="#FFFFFF" stroke="#D4D9DC"/><text x="242" y="804" font-size="22" fill="#192329" font-weight="700">Complete the follow-through</text><text x="242" y="834" font-size="18" fill="#192329" font-weight="400">Invoices, client review and lessons</text><text x="242" y="860" font-size="18" fill="#192329" font-weight="400">Output: closeout + follow-up</text><text x="910" y="806" font-size="13" fill="#53616A" font-weight="700">REVIEW POINT</text><text x="910" y="837" font-size="17" fill="#192329" font-weight="700">Closeout review</text><text x="48" y="960" font-size="16" fill="#53616A" font-weight="400">Gerusa Souza / Event planning, hospitality and operations</text></g></svg>