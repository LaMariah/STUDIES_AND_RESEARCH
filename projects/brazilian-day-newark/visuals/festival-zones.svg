<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Six zones. One coordinated festival.</title><desc id="desc">Schematic zone guide based on Gerusa’s production recollection. Not a street-scale plan.</desc><rect width="1200" height="850" fill="#f5f2ea"/><g font-family="Arial, sans-serif"><text x="48" y="45" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / PROJECT MANAGEMENT</text><text x="48" y="101" font-size="35" fill="#192329" font-weight="700">Six zones. One coordinated festival.</text><rect x="48" y="150" width="1104" height="100" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="185" font-size="23" fill="#192329" font-weight="700">FERRY STREET + NIAGARA STREET</text><text x="70" y="218" font-size="18" fill="#192329" font-weight="400">Festival site relationships / six operating areas</text><rect x="48" y="290" width="528" height="125" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="70" y="325" font-size="23" fill="white" font-weight="700">1 / MAIN STAGE</text><text x="70" y="358" font-size="18" fill="white" font-weight="400">Front of the lot, by Ferry and Niagara</text><rect x="624" y="290" width="528" height="125" rx="12" fill="white" stroke="#d1d8da"/><text x="646" y="325" font-size="23" fill="#192329" font-weight="700">2 / VIP AREA</text><text x="646" y="358" font-size="18" fill="#192329" font-weight="400">Space around the bank</text><rect x="48" y="450" width="528" height="125" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="70" y="485" font-size="23" fill="white" font-weight="700">3 / BACKSTAGE</text><text x="70" y="518" font-size="18" fill="white" font-weight="400">Three trailers for hosts and artists</text><rect x="624" y="450" width="528" height="125" rx="12" fill="white" stroke="#d1d8da"/><text x="646" y="485" font-size="23" fill="#192329" font-weight="700">4 / SPONSOR ACTIVATIONS</text><text x="646" y="518" font-size="18" fill="#192329" font-weight="400">Dedicated partner activity space</text><rect x="48" y="610" width="528" height="125" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="70" y="645" font-size="23" fill="white" font-weight="700">5 / FOOD VENDORS</text><text x="70" y="678" font-size="18" fill="white" font-weight="400">Along Niagara Street</text><rect x="624" y="610" width="528" height="125" rx="12" fill="white" stroke="#d1d8da"/><text x="646" y="645" font-size="23" fill="#192329" font-weight="700">6 / CHILDREN’S RECREATION</text><text x="646" y="678" font-size="18" fill="#192329" font-weight="400">Near Bread of Life / Pão da Vida</text><text x="48" y="822" font-size="16" fill="#53616A" font-weight="400">Schematic zone guide based on Gerusa’s production recollection. Not a street-scale plan.</text></g></svg>