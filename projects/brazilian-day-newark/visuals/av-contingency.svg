<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">A staffing gap became a coordinated response.</title><desc id="desc">Project story: Gerusa Souza / Brazilian Day Newark 2019</desc><rect width="1200" height="710" fill="#f5f2ea"/><g font-family="Arial, sans-serif"><text x="48" y="45" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / PROJECT MANAGEMENT</text><text x="48" y="101" font-size="35" fill="#192329" font-weight="700">A staffing gap became a coordinated response.</text><rect x="48" y="150" width="530" height="120" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="185" font-size="23" fill="#192329" font-weight="700">1 / THE GAP</text><text x="70" y="218" font-size="18" fill="#192329" font-weight="400">Two AV technicians could not travel.</text><rect x="622" y="150" width="530" height="120" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="644" y="185" font-size="23" fill="white" font-weight="700">2 / LOCAL RESPONSE</text><text x="644" y="218" font-size="18" fill="white" font-weight="400">Find a Portuguese-speaking technician.</text><rect x="48" y="314" width="530" height="150" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="349" font-size="23" fill="#192329" font-weight="700">3 / CREW LOGISTICS</text><text x="70" y="382" font-size="18" fill="#192329" font-weight="400">Bring the travelling lead in early</text><text x="70" y="409" font-size="18" fill="#192329" font-weight="400">using crew accommodation and meals.</text><rect x="622" y="314" width="530" height="150" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="644" y="349" font-size="23" fill="white" font-weight="700">4 / TECHNICAL HANDOVER</text><text x="644" y="382" font-size="18" fill="white" font-weight="400">Lead coaches the local hire</text><text x="644" y="409" font-size="18" fill="white" font-weight="400">and covers additional hours.</text><rect x="48" y="510" width="1104" height="114" rx="12" fill="white" stroke="#d1d8da"/><text x="70" y="545" font-size="23" fill="#192329" font-weight="700">RESULT</text><text x="70" y="578" font-size="18" fill="#192329" font-weight="400">The show ran without an AV disruption.</text><text x="48" y="682" font-size="16" fill="#53616A" font-weight="400">Project story: Gerusa Souza / Brazilian Day Newark 2019</text></g></svg>