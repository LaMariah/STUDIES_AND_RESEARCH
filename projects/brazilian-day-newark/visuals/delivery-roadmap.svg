<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">From project brief to closeout.</title><desc id="desc">Phases show the project approach. No historical task dates are assigned.</desc><rect width="1200" height="880" fill="#f5f2ea"/><g font-family="Arial, sans-serif"><text x="48" y="45" font-size="15" fill="#244ADB" font-weight="700">GERUSA SOUZA / PROJECT MANAGEMENT</text><text x="48" y="101" font-size="35" fill="#192329" font-weight="700">From project brief to closeout.</text><text x="48" y="190" font-size="24" fill="#244ADB" font-weight="700">01</text><rect x="145" y="150" width="1007" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="167" y="185" font-size="23" fill="#192329" font-weight="700">Scope + budget</text><text x="167" y="218" font-size="18" fill="#192329" font-weight="400">Define requirements, estimate costs and identify partner support.</text><path d="M640 260v26" stroke="#244ADB" stroke-width="2"/><text x="48" y="326" font-size="24" fill="#244ADB" font-weight="700">02</text><rect x="145" y="286" width="1007" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="167" y="321" font-size="23" fill="#192329" font-weight="700">Partners + production</text><text x="167" y="354" font-size="18" fill="#192329" font-weight="400">Confirm commitments; coordinate artists, suppliers and site needs.</text><path d="M640 396v26" stroke="#244ADB" stroke-width="2"/><text x="48" y="462" font-size="24" fill="#244ADB" font-weight="700">03</text><rect x="145" y="422" width="1007" height="110" rx="12" fill="#244ADB" stroke="#d1d8da"/><text x="167" y="457" font-size="23" fill="white" font-weight="700">Prepare teams + communications</text><text x="167" y="490" font-size="18" fill="white" font-weight="400">Plan the site, brief leads and coordinate promotional materials.</text><path d="M640 532v26" stroke="#244ADB" stroke-width="2"/><text x="48" y="598" font-size="24" fill="#244ADB" font-weight="700">04</text><rect x="145" y="558" width="1007" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="167" y="593" font-size="23" fill="#192329" font-weight="700">Deliver + respond</text><text x="167" y="626" font-size="18" fill="#192329" font-weight="400">Coordinate operational teams and resolve the AV staffing gap.</text><path d="M640 668v26" stroke="#244ADB" stroke-width="2"/><text x="48" y="734" font-size="24" fill="#244ADB" font-weight="700">05</text><rect x="145" y="694" width="1007" height="110" rx="12" fill="white" stroke="#d1d8da"/><text x="167" y="729" font-size="23" fill="#192329" font-weight="700">Closeout framework</text><text x="167" y="762" font-size="18" fill="#192329" font-weight="400">Reconcile invoices, debrief delivery and organise the handover.</text><text x="48" y="852" font-size="16" fill="#53616A" font-weight="400">Phases show the project approach. No historical task dates are assigned.</text></g></svg>