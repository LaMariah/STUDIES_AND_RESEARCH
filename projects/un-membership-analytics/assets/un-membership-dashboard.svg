<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UN Latin Club membership and engagement dashboard</title>
  <desc id="desc">Dashboard showing a 20 percent lapsed member reactivation rate, 15 percent engagement growth, membership segments, a reactivation funnel, and content performance.</desc>
  <style>
    .bg{fill:#eef2f6}.panel{fill:#fff}.navy{fill:#173a5e}.blue{fill:#378bd8}.red{fill:#e74b4b}.green{fill:#18a477}.gold{fill:#c47a10}.gray{fill:#7d8288}.ink{fill:#172234}.muted{fill:#667487}.white{fill:#fff}.h1{font:700 27px Arial,sans-serif}.h2{font:700 18px Arial,sans-serif}.kpi{font:700 34px Arial,sans-serif}.label{font:700 13px Arial,sans-serif}.body{font:14px Arial,sans-serif}.small{font:12px Arial,sans-serif}.grid{stroke:#dce3ea;stroke-width:1}.barlabel{font:700 13px Arial,sans-serif;fill:#172234}
  </style>
  <rect class="bg" width="1200" height="680"/>
  <rect class="navy" x="35" y="28" width="1130" height="72" rx="4"/>
  <text class="h1 white" x="58" y="64">UN Latin Club Society</text>
  <text class="body white" x="58" y="86">Membership and engagement analytics | Gerusa Souza | New York, 2024</text>

  <g transform="translate(35 118)">
    <rect class="panel" width="260" height="94" rx="4"/>
    <text class="label muted" x="20" y="27">LAPSED REACTIVATION</text><text class="kpi green" x="20" y="66">20%</text><text class="small muted" x="105" y="64">47 of 235 members</text>
  </g>
  <g transform="translate(310 118)">
    <rect class="panel" width="260" height="94" rx="4"/>
    <text class="label muted" x="20" y="27">DIGITAL ENGAGEMENT</text><text class="kpi green" x="20" y="66">+15%</text><text class="small muted" x="125" y="64">over seven weeks</text>
  </g>
  <g transform="translate(585 118)">
    <rect class="panel" width="260" height="94" rx="4"/>
    <text class="label muted" x="20" y="27">PRIORITY SEGMENT</text><text class="kpi red" x="20" y="66">47%</text><text class="small muted" x="112" y="64">of membership base</text>
  </g>
  <g transform="translate(860 118)">
    <rect class="panel" width="305" height="94" rx="4"/>
    <text class="label muted" x="20" y="27">TOP CONTENT THEME</text><text class="h2 gold" x="20" y="60">Endangered languages</text><text class="small muted" x="20" y="80">Highest engagement index</text>
  </g>

  <g transform="translate(35 230)">
    <rect class="panel" width="548" height="410" rx="4"/>
    <text class="h2 ink" x="22" y="32">Membership segmentation</text>
    <line class="grid" x1="58" y1="350" x2="515" y2="350"/><line class="grid" x1="58" y1="270" x2="515" y2="270"/><line class="grid" x1="58" y1="190" x2="515" y2="190"/><line class="grid" x1="58" y1="110" x2="515" y2="110"/>
    <rect class="blue" x="88" y="160" width="105" height="190"/><rect class="red" x="222" y="115" width="105" height="235"/><rect class="gray" x="356" y="275" width="105" height="75"/>
    <text class="barlabel" x="123" y="150">190</text><text class="barlabel" x="257" y="105">235</text><text class="barlabel" x="389" y="265">75</text>
    <text class="body ink" x="117" y="375">Active</text><text class="body ink" x="252" y="375">Lapsed</text><text class="body ink" x="365" y="375">Never renewed</text>
  </g>

  <g transform="translate(600 230)">
    <rect class="panel" width="565" height="198" rx="4"/>
    <text class="h2 ink" x="22" y="32">Reactivation funnel</text>
    <rect fill="#9ec4e8" x="28" y="52" width="505" height="25"/><rect fill="#71a9dc" x="68" y="84" width="425" height="25"/><rect class="blue" x="118" y="116" width="325" height="25"/><rect fill="#246fb9" x="168" y="148" width="225" height="25"/>
    <text class="small ink" x="38" y="69">Contacted 235</text><text class="small ink" x="78" y="101">Opened 141</text><text class="small white" x="128" y="133">Attended 94</text><text class="small white" x="178" y="165">Renewed 47</text>
  </g>

  <g transform="translate(600 442)">
    <rect class="panel" width="565" height="198" rx="4"/>
    <text class="h2 ink" x="22" y="32">Content performance index</text>
    <text class="small ink" x="22" y="66">Endangered languages</text><rect class="navy" x="170" y="52" width="340" height="20"/><text class="small ink" x="518" y="67">695</text>
    <text class="small ink" x="22" y="98">SDG infographics</text><rect class="blue" x="170" y="84" width="264" height="20"/><text class="small ink" x="442" y="99">540</text>
    <text class="small ink" x="22" y="130">Event recaps</text><rect class="blue" x="170" y="116" width="198" height="20"/><text class="small ink" x="376" y="131">405</text>
    <text class="small ink" x="22" y="162">Culture posts</text><rect class="blue" x="170" y="148" width="144" height="20"/><text class="small ink" x="322" y="163">295</text>
  </g>
</svg>
